<!doctype html>
<html lang = "en">
	<head>
	<meta charset = "UTF-8">
	<link rel = "icon" type = "image/jpg" href = "chud 2.jpg">
		<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
		<title>My first website ever!</title>
		<style>
			#video-overlay {
				display: none;
				position: fixed;
				inset: 0;
				background: rgba(0, 0, 0, 0.9);
				z-index: 1000;
				justify-content: center;
				align-items: center;
			}
			#myvideo {
				width: 80%;
				max-width: 800px;
			}
			#closebutton {
				position: absolute;
				top: 20px;
				right: 25px;
				font-size: 30px;
				color: #7229D6;
				background: none;
				border: none;
				cursor: pointer;
			}
			.icon {
				display: flex;
				justify-content: flex-start;
				text-align: center;
			}
			.icon-item {
				display: flex;
				flex-direction: column;
				align-items: center;
				text-align: center;
			}
			.icon-item img {
				width: 60px;
				height: 60px;
				object-fit: contain;
			}
			.icon-item p {
				padding: 0;
				margin-top: 2px;
				font-size: 12px;
				color: #7229D6;
			}
			body {
				font-family: 'Press Start 2P', Monospace;
				background-image: url("idk.png");
				background-size: cover;
				background-position: center;
				background-repeat: no-repeat;
				background-attachment: fixed;
				color: white;
				}
			h1 {
				text-shadow: 5px 5px 5px #6400EB;
				color: #46097D;
				font-size: 0.8cm;
				padding: 0px;
			}
			p {
				text-shadow: 5px 5px 5px #000000;
				font-size: 0.35cm;
				padding: 0px;
			}
		</style>
	</head>
	<body>
		<div class = "icon">
			<div class = "icon-item">
				<img src = "dolly.gif" alt = "chud" onclick = "openvideo()" style = "cursor: pointer;">
				<p>Fat chud</p>
			</div>
		</div>
		<div id = "video-overlay">
			<button onclick = "closevideo()" id = "closebutton">X</button>
			<video id = "myvideo" controls>
				<source src = "forever alex g.mp4" type = "video/mp4">
				You're a chud!
			</video>
		</div>
		<br>
		<div>
			<h1>Alyna</h1>
			<p>Haiiii, my name is Alyna, I'm an original character from someone!</p>
		</div>
		<script>
			function openvideo() {
				const overlay = document.getElementById("video-overlay");
				const video = document.getElementById("myvideo");
				overlay.style.display = "flex";
				video.play();
			}
			function closevideo() {
				const overlay = document.getElementById("video-overlay");
				const video = document.getElementById("myvideo");
				video.pause();
				video.currentTime = 0;
				overlay.style.display = "none";
			}
		</script>
	</body>
</html>
